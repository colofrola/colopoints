function newUserData(name){
  return {
    name, avatar:null, points:0, debt:0, totalEarned:0,
    completedToday:{}, history:[],
    rewards:INITIAL_REWARDS.map(r=>({...r})),
    tasks:TASKS.map(t=>({...t})),
    catColor:{...DEFAULT_CAT_COLOR}, catLabel:{...DEFAULT_CAT_LABEL},
  };
}

function avatarEl(u, size=44){
  const s = size+"px";
  const wrap = div({width:s,height:s,borderRadius:"50%",overflow:"hidden",flexShrink:"0",

// Shortcuts to active user data
function U(){ return S.users[S.activeUser]; }

// ── Persistencia localStorage ──────────────────────────────────────────────
function saveState(){
  try {
    localStorage.setItem("sistemaFichas_v2", JSON.stringify({
      users: S.users,
      activeUser: S.activeUser,
      pin: S.pin,
      redeemDay: S.redeemDay,
      redeemHour: S.redeemHour,
    }));
  } catch(e){}
}

function loadState(){
  try {
    // migrate from v1
    const old = localStorage.getItem("sistemaFichas_v1");
    if(old){
      const d = JSON.parse(old);
      const u = S.users[0];
      if(d.points!==undefined) u.points=d.points;
      if(d.debt!==undefined) u.debt=d.debt;
      if(d.totalEarned!==undefined) u.totalEarned=d.totalEarned;
      if(d.completedToday) u.completedToday=d.completedToday;
      if(d.history) u.history=d.history;
      if(d.childName) u.name=d.childName;
      if(d.rewards&&d.rewards.length) u.rewards=d.rewards;
      if(d.tasks&&d.tasks.length) u.tasks=d.tasks;
      if(d.catColor) u.catColor=d.catColor;
      if(d.catLabel) u.catLabel=d.catLabel;
      localStorage.removeItem("sistemaFichas_v1");
    }
    const raw = localStorage.getItem("sistemaFichas_v2");
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data.users && data.users.length) {
      S.users = data.users;
      // If a user has no tasks at all, load the defaults
      S.users.forEach(function(u){
        if(!u.tasks || u.tasks.length === 0){
          u.tasks = TASKS.map(function(t){return Object.assign({},t);});
        }
      });
    }
    if(data.activeUser !== undefined) S.activeUser = data.activeUser;
    if(data.pin) S.pin = data.pin;
    if(data.redeemDay !== undefined) S.redeemDay = data.redeemDay;
    if(data.redeemHour !== undefined) S.redeemHour = data.redeemHour;
  } catch(e){}
}

function todayLabel(){return new Date().toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"});}
function workingDate(){
  if(S.selectedDate) return S.selectedDate;
  return todayLabel();
}
function workingDateObj(){
  if(S.selectedDate){
    // find the date object matching the label
    var d=new Date();
    for(var i=0;i<7;i++){
      var test=new Date(d);test.setDate(d.getDate()-i);
      if(test.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})===S.selectedDate) return test;
    }
  }
  return new Date();
}
function isFriday(){return new Date().getDay()===S.redeemDay;}
function isFridayEvening(){return isFriday()&&new Date().getHours()>=S.redeemHour;}

function showToast(msg,emoji="⭐"){
  if(S.toastTimer)clearTimeout(S.toastTimer);
  S.toast={msg,emoji};
  render();
  S.toastTimer=setTimeout(()=>{S.toast=null;render();},2400);
}
function fireConfetti(){
  if(S.confettiTimer)clearTimeout(S.confettiTimer);
  S.confetti=true; render();
  S.confettiTimer=setTimeout(()=>{S.confetti=false;render();},2000);
}

function fmt(n){return n===Math.floor(n)?n+"":n.toFixed(1).replace(".0","");}
function toggleTask(task){
  const key=workingDate()+"-"+task.id;
  const cur=U().completedToday[key]||0; // 0, 0.5, or 1
  let next, diff;
  if(cur===0){next=1; diff=task.points;}
  else if(cur===1){next=0.5; diff=-task.points/2;}
  else{next=0; diff=-task.points/2;}

  if(next===0){
    delete U().completedToday[key];
  } else {
    U().completedToday[key]=next;
  }

  U().points=Math.max(0, U().points+diff);
  if(diff>0){
    U().totalEarned+=diff;
    const earned=diff;
    U().history.unshift({task:task.name+(next===0.5?" (medio)":""),emoji:task.emoji,points:earned,when:todayLabel(),type:"task"});
    if(U().history.length>50)U().history.pop();
    if(U().debt>0){
      const pay=Math.min(U().debt,earned);
      const left=earned-pay;
      U().debt=Math.max(0,U().debt-pay); U().points=Math.max(0,U().points-(earned-left));
      showToast("Pagaste "+fmt(pay)+"⭐ de deuda"+(left>0?" · +"+fmt(left)+"⭐":""),task.emoji);
    } else {
      showToast("+"+(next===0.5?fmt(task.points/2):fmt(task.points))+" puntos"+(next===0.5?" (½)":""),task.emoji);
      if(next===1)fireConfetti();
    }
  } else {
    U().totalEarned=Math.max(0,U().totalEarned+diff);
    showToast(fmt(diff)+" puntos","↩️");
  }
  render();
}

function confirmRedeem(){
  const r=S.redeemTarget;
  if(!r||!S.redeemDetail.trim()){showToast("Escribí qué se canjea","✏️");return;}
  U().points-=r.points;
  U().history.unshift({task:"Canje: "+r.name,detail:S.redeemDetail.trim(),emoji:r.emoji,points:-r.points,when:todayLabel(),type:"redeem"});
  showToast("¡Canjeado! → "+S.redeemDetail.trim(),r.emoji);
  fireConfetti();
  S.redeemTarget=null; S.redeemDetail="";
  render();
}

function confirmLoan(){
  const r=S.loanTarget;
  if(!r||!S.loanDetail.trim()){showToast("Escribí el motivo","✏️");return;}
  const missing=r.points-U().points;
  U().points-=r.points; U().debt+=missing;
  U().history.unshift({task:"Préstamo: "+r.name,detail:S.loanDetail.trim(),emoji:"🤝",points:-r.points,when:todayLabel(),type:"loan",debtAmount:missing});
  showToast("Préstamo de "+missing+"⭐ registrado","🤝");
  S.loanTarget=null; S.loanDetail="";
  render();
}

function tryPin(){
  if(S.pinInput===S.pin){
    if(S.pinTarget==="exception"){
      S.exceptionMode=true;
      showToast("Modo excepción activado — 5 min","🔓");
      if(S.exceptionTimer) clearTimeout(S.exceptionTimer);
      S.exceptionTimer=setTimeout(function(){
        S.exceptionMode=false;
        S.exceptionTimer=null;
        showToast("Modo excepción desactivado","🔒");
        render();
      }, 5*60*1000);
    }
    if(S.pinTarget==="editor"){S.showEditor=true;}
    if(S.pinTarget==="taskEditor"){S.showTaskEditor=true;}
    if(S.pinTarget==="userManager"){S.showUserManager=true;}
    if(S.pinTarget==="datePicker"){S.showDatePicker=true;}
    S.pinTarget=null; S.pinInput="";
  } else {
    showToast("PIN incorrecto","❌"); S.pinInput="";
  }
  render();
}

function saveEditorEdit(){
  const e=S.editorEditing;
  if(!e||!e.name.trim()){showToast("Escribí un nombre","⚠️");return;}
  const pts=parseInt(e.points);
  if(!pts||pts<1){showToast("Puntos inválidos","⚠️");return;}
  U().rewards=U().rewards.map(r=>r.id===e.id?{...e,points:pts}:r).sort((a,b)=>a.points-b.points);
  S.editorEditing=null; showToast("Premio actualizado");
  render();
}

function addEditorNew(){
  const n=S.editorNew;
  if(!n.name.trim()){showToast("Escribí un nombre","⚠️");return;}
  const pts=parseInt(n.points);
  if(!pts||pts<1){showToast("Ponele puntos","⚠️");return;}
  U().rewards.push({id:Date.now(),emoji:n.emoji||"🎁",name:n.name.trim(),points:pts});
  U().rewards.sort((a,b)=>a.points-b.points);
  S.editorNew={emoji:"🎉",name:"",points:""};
  showToast("¡Premio agregado! 🎉"); render();
}

function deleteReward(id){
  U().rewards=U().rewards.filter(r=>r.id!==id);
  S.editorDeleteConfirm=null; showToast("Eliminado","🗑️"); render();
}


function saveTaskEdit(){
  const e=S.taskEditorEditing;
  if(!e||!e.name.trim()){showToast("Escribí un nombre","⚠️");return;}
  const pts=parseInt(e.points);
  if(!pts||pts<1){showToast("Puntos inválidos","⚠️");return;}
  U().tasks=U().tasks.map(t=>t.id===e.id?{...e,points:pts}:t);
  S.taskEditorEditing=null; showToast("Tarea actualizada");
  render();
}

function addTaskNew(){
  const n=S.taskEditorNew;
  if(!n.name.trim()){showToast("Escribí un nombre","⚠️");return;}
  const pts=parseInt(n.points);
  if(!pts||pts<1){showToast("Ponele puntos","⚠️");return;}
  U().tasks.push({id:Date.now(),emoji:n.emoji||"⭐",name:n.name.trim(),points:pts,cat:n.cat||"cuarto"});
  S.taskEditorNew={emoji:"⭐",name:"",points:"",cat:"cuarto"};
  showToast("¡Tarea agregada! 🎉"); render();
}

function deleteTask(id){
  U().tasks=U().tasks.filter(t=>t.id!==id);
  S.taskEditorDeleteConfirm=null; showToast("Tarea eliminada","🗑️"); render();

function canRedeem(){return isFriday()||S.exceptionMode;}
function todayDone(){return U().tasks.filter(t=>U().completedToday[workingDate()+"-"+t.id]>0);}

// ── HTML helpers ───────────────────────────────────────────────────────────
function el(tag,attrs,...children){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="style"&&typeof v==="object"){Object.assign(e.style,v);}
    else if(k.startsWith("on")&&typeof v==="function"){e.addEventListener(k.slice(2).toLowerCase(),v);}
    else if(k==="cls"){e.className=v;}
    else{e[k]=v;}
  }
  for(const c of children){
    if(c==null||c===false)continue;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  }
  return e;
}
function div(s,...c){return el("div",{style:s},...c);}
function btn(s,cb,...c){return el("button",{style:s,onClick:cb},...c);}
function inp(s,val,cb,extra){
  const i=el("input",{style:s,...(extra||{})});
  i.value=val;
  i.addEventListener("input",e=>cb(e.target.value));
  return i;
}
function span(s,t){return el("span",{style:s},t);}

function starBar(points,max=100){
  const pct=Math.min((Math.max(points,0)/max)*100,100);
  const wrap=div({width:"100%",background:"#0f0a2e",borderRadius:"999px",height:"22px",overflow:"hidden",position:"relative",border:"1px solid #312e81",marginTop:"12px"});
  wrap.appendChild(div({width:pct+"%",height:"100%",background:"linear-gradient(90deg,#818cf8,#f472b6)",borderRadius:"999px",transition:"width .6s",boxShadow:"0 0 14px #818cf888"}));
  const lbl=span({position:"absolute",right:"10px",top:"0",fontSize:"12px",color:"#c7d2fe",lineHeight:"22px",fontWeight:"700"},fmt(points)+" ⭐");
  wrap.appendChild(lbl);
  return wrap;
}

function confettiEl(){
  const wrap=div({position:"fixed",top:"0",left:"0",width:"100%",pointerEvents:"none",zIndex:"9999"});
  for(let i=0;i<28;i++){
    const colors=["#f472b6","#818cf8","#34d399","#fb923c","#fbbf24"];
    const p=div({position:"absolute",left:(2+i*3.5)+"%",top:"-20px",width:(8+(i%5)*4)+"px",height:(8+(i%5)*4)+"px",background:colors[i%5],borderRadius:"3px",animation:"fall 1.6s "+(i*0.055).toFixed(2)+"s ease-in forwards"});
    wrap.appendChild(p);
  }
  return wrap;
}

  w.appendChild(span({fontSize:"24px"},t.emoji));
  w.appendChild(document.createTextNode(t.msg));

function modal(content,onClose,wide){
  const overlay=div({position:"fixed",inset:"0",background:"rgba(0,0,0,0.78)",zIndex:"2000",display:"flex",alignItems:"center",justifyContent:"center",padding:"32px"});
  const box=div({background:"#1e1b4b",border:"1.5px solid #4338ca",borderRadius:"24px",padding:"32px",width:"100%",maxWidth:wide?"680px":"460px",position:"relative",boxShadow:"0 24px 80px rgba(0,0,0,0.6)",maxHeight:"88vh",overflowY:"auto"});
  const closeBtn=btn({position:"absolute",top:"14px",right:"18px",background:"none",color:"#818cf8",fontSize:"24px",lineHeight:"1",padding:"0"},onClose,"✕");
  box.appendChild(closeBtn);
  box.appendChild(content);
  overlay.appendChild(box);
  return overlay;

function renderEditor(){
  const wrap=div({});
  wrap.appendChild(div({fontWeight:"800",fontSize:"20px",color:"#c7d2fe",marginBottom:"4px"},"✏️ Editar premios"));
  wrap.appendChild(div({fontSize:"13px",color:"#6366f1",marginBottom:"18px"},"Cambiá, agregá o eliminá premios."));

  // list
  const list=div({display:"flex",flexDirection:"column",gap:"10px",marginBottom:"22px"});
  for(const r of U().rewards){
    const row=div({background:"#0f0a2e",borderRadius:"14px",padding:"12px 16px",border:"1px solid #312e81"});
    if(S.editorEditing&&S.editorEditing.id===r.id){
      const grid=div({display:"grid",gridTemplateColumns:"52px 1fr 74px auto",gap:"10px",alignItems:"center"});
      const iEmoji=btn({background:"#1e1b4b",border:"1px solid #4338ca",borderRadius:"8px",padding:"4px",fontSize:"26px",width:"52px",textAlign:"center"},()=>emojiPicker(e=>{S.editorEditing.emoji=e;render();}),S.editorEditing.emoji);
      const iName=inp({background:"#1e1b4b",border:"1px solid #4338ca",borderRadius:"8px",padding:"10px 14px",color:"#fff",fontSize:"15px",outline:"none",width:"100%"},S.editorEditing.name,v=>{S.editorEditing.name=v;});
      const iPts=inp({background:"#1e1b4b",border:"1px solid #4338ca",borderRadius:"8px",padding:"10px",color:"#fff",fontSize:"15px",textAlign:"center",outline:"none",width:"100%"},S.editorEditing.points,v=>{S.editorEditing.points=v;},{type:"number"});
      const btns=div({display:"flex",gap:"6px"});
      btns.appendChild(btn({background:"#34d399",borderRadius:"8px",padding:"8px 14px",color:"#fff",fontWeight:"800",fontSize:"14px"},saveEditorEdit,"✓"));
      btns.appendChild(btn({background:"#312e81",borderRadius:"8px",padding:"8px 12px",color:"#a5b4fc",fontWeight:"700",fontSize:"14px"},()=>{S.editorEditing=null;render();},"✕"));
      grid.appendChild(iEmoji);grid.appendChild(iName);grid.appendChild(iPts);grid.appendChild(btns);
      row.appendChild(grid);
    } else {
      const line=div({display:"flex",alignItems:"center",gap:"12px"});
      line.appendChild(span({fontSize:"28px"},r.emoji));
      const info=div({flex:"1"});
      info.appendChild(div({fontWeight:"700",fontSize:"15px",color:"#e0e7ff"},r.name));
      info.appendChild(div({fontSize:"13px",color:"#6366f1"},r.points+" ⭐"));
      line.appendChild(info);
      line.appendChild(btn({background:"#312e81",borderRadius:"8px",padding:"7px 14px",color:"#a5b4fc",fontWeight:"700",fontSize:"13px"},()=>{S.editorEditing={...r};S.editorDeleteConfirm=null;render();},"✏️ Editar"));
      if(S.editorDeleteConfirm===r.id){
        const dc=div({display:"flex",gap:"6px",alignItems:"center"});
        dc.appendChild(span({fontSize:"12px",color:"#f87171"},"¿Eliminar?"));
        dc.appendChild(btn({background:"#f87171",borderRadius:"8px",padding:"6px 12px",color:"#fff",fontWeight:"800",fontSize:"13px"},()=>deleteReward(r.id),"Sí"));
        dc.appendChild(btn({background:"#312e81",borderRadius:"8px",padding:"6px 10px",color:"#a5b4fc",fontWeight:"700",fontSize:"13px"},()=>{S.editorDeleteConfirm=null;render();},"No"));

function safeNode(x, label){
  if(x instanceof Node) return x;
  var d = document.createElement("span");
  d.style.color = "#f87171";
  d.textContent = "[ERR:"+label+"="+typeof x+"]";
  return d;
}

// ── Photo cropper ────────────────────────────────────────────────────────────
function openCropper(dataUrl, onConfirm){
  const overlay = div({position:"fixed",inset:"0",background:"rgba(0,0,0,0.92)",zIndex:"4000",
    display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"16px"});

  const SIZE = 280; // circle display size
  let scale = 1, ox = 0, oy = 0; // offset = translation of image inside frame
  let dragging = false, lastX = 0, lastY = 0;
  let imgW = 0, imgH = 0; // natural image display size at scale=1

  const title = div({color:"#c7d2fe",fontWeight:"700",fontSize:"16px"},"Ajustá la foto");
  overlay.appendChild(title);

  // circular clip frame
  const frame = div({
    width:SIZE+"px", height:SIZE+"px", borderRadius:"50%",
    overflow:"hidden", position:"relative",
    border:"3px solid #818cf8", boxShadow:"0 0 0 4px #0f0a2e",
    background:"#1e1b4b", cursor:"grab", flexShrink:"0"
  });

  const img = el("img",{src:dataUrl,style:{
    position:"absolute", transformOrigin:"0 0",
    userSelect:"none", pointerEvents:"none", draggable:"false"
  }});
  frame.appendChild(img);
  overlay.appendChild(frame);

  function clamp(){
    const dw = imgW * scale, dh = imgH * scale;
    // keep image covering the circle
    if(ox > 0) ox = 0;
    if(oy > 0) oy = 0;
    if(ox < SIZE - dw) ox = Math.min(0, SIZE - dw);
    if(oy < SIZE - dh) oy = Math.min(0, SIZE - dh);
  }

  function applyTransform(){
    img.style.transform = "translate("+ox+"px,"+oy+"px) scale("+scale+")";
  }

  img.addEventListener("load", ()=>{
    imgW = img.naturalWidth;
    imgH = img.naturalHeight;
    // fit so image covers circle
    const fit = Math.max(SIZE/imgW, SIZE/imgH);
    scale = fit;
    ox = (SIZE - imgW*scale)/2;
    oy = (SIZE - imgH*scale)/2;
    applyTransform();
  });

  // drag
  frame.addEventListener("mousedown", e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;frame.style.cursor="grabbing";e.preventDefault();});
  window.addEventListener("mousemove", e=>{if(!dragging)return;ox+=e.clientX-lastX;oy+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;clamp();applyTransform();});
  window.addEventListener("mouseup", ()=>{dragging=false;frame.style.cursor="grab";});

  // touch drag
  frame.addEventListener("touchstart", e=>{const t=e.touches[0];lastX=t.clientX;lastY=t.clientY;e.preventDefault();},{passive:false});
  frame.addEventListener("touchmove", e=>{const t=e.touches[0];ox+=t.clientX-lastX;oy+=t.clientY-lastY;lastX=t.clientX;lastY=t.clientY;clamp();applyTransform();e.preventDefault();},{passive:false});

  // pinch zoom
  let lastDist = 0;
  frame.addEventListener("touchstart", e=>{if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;lastDist=Math.hypot(dx,dy);}},{passive:true});
  frame.addEventListener("touchmove", e=>{
    if(e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
      const dist=Math.hypot(dx,dy);
      const delta=dist/lastDist;
      lastDist=dist;
      const newScale=Math.max(scale*(1/1.5), Math.min(scale*3, scale*delta));
      // zoom toward center
      const cx=SIZE/2, cy=SIZE/2;
      ox=cx-(cx-ox)*(newScale/scale);
      oy=cy-(cy-oy)*(newScale/scale);
      scale=newScale;
      clamp();applyTransform();
    }
  },{passive:true});

  // scroll wheel zoom on desktop
  frame.addEventListener("wheel", e=>{
    e.preventDefault();
    const delta = e.deltaY < 0 ? 1.08 : 0.93;
    const newScale = Math.max(imgW?SIZE/imgW*0.9:0.5, Math.min(scale*4, scale*delta));
    const cx=SIZE/2,cy=SIZE/2;
    ox=cx-(cx-ox)*(newScale/scale);
    oy=cy-(cy-oy)*(newScale/scale);
    scale=newScale;
    clamp();applyTransform();
  },{passive:false});

  // zoom slider
  const sliderWrap = div({display:"flex",alignItems:"center",gap:"12px",width:SIZE+"px"});
  sliderWrap.appendChild(span({color:"#818cf8",fontSize:"18px"},"🔍"));
  const slider = el("input",{type:"range",min:"50",max:"300",value:"100",
    style:{flex:"1",accentColor:"#818cf8",height:"6px",cursor:"pointer"}});
  slider.addEventListener("input", ()=>{
    const pct = parseInt(slider.value)/100;
    const base = imgW ? Math.max(SIZE/imgW, SIZE/imgH) : 1;
    const newScale = base * pct;
    const cx=SIZE/2,cy=SIZE/2;
    ox=cx-(cx-ox)*(newScale/scale);
    oy=cy-(cy-oy)*(newScale/scale);
    scale=newScale;
    clamp();applyTransform();
  });
  sliderWrap.appendChild(slider);
  sliderWrap.appendChild(span({color:"#818cf8",fontSize:"22px"},"🔍"));
  overlay.appendChild(sliderWrap);

  const hint = div({color:"#6366f1",fontSize:"13px"},"Arrastrá para mover · Pellizco o rueda para zoom");
  overlay.appendChild(hint);

  // buttons
  const btns = div({display:"flex",gap:"12px"});
  btns.appendChild(btn({background:"#312e81",border:"none",borderRadius:"12px",padding:"12px 24px",color:"#a5b4fc",fontWeight:"700",fontSize:"15px"},()=>overlay.remove(),"Cancelar"));
  btns.appendChild(btn({background:"linear-gradient(135deg,#34d399,#059669)",border:"none",borderRadius:"12px",padding:"12px 28px",color:"#fff",fontWeight:"800",fontSize:"15px"},()=>{
    // render to canvas
    const canvas = el("canvas",{width:SIZE,height:SIZE});
    const ctx2 = canvas.getContext("2d");
    ctx2.beginPath();
    ctx2.arc(SIZE/2,SIZE/2,SIZE/2,0,Math.PI*2);
    ctx2.clip();
    ctx2.drawImage(img, ox, oy, imgW*scale, imgH*scale);
    const result = canvas.toDataURL("image/jpeg",0.85);
    overlay.remove();
    onConfirm(result);
  },"✅ Confirmar"));
  overlay.appendChild(btns);

  document.body.appendChild(overlay);
}

function openAvatarUpload(){
  const fileInp = el("input",{type:"file",accept:"image/*",style:{display:"none"}});
  fileInp.addEventListener("change", e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      openCropper(ev.target.result, cropped => {
        U().avatar = cropped;
        render();
      });
    };
    reader.readAsDataURL(file);
  });
  document.body.appendChild(fileInp);
  fileInp.click();
  setTimeout(()=>fileInp.remove(), 60000);
}

// Service Worker for offline
if("serviceWorker" in navigator){
  var swCode = [
    "self.addEventListener('install',function(e){self.skipWaiting();});",
    "self.addEventListener('activate',function(e){clients.claim();});",
    "self.addEventListener('fetch',function(e){",
    "  e.respondWith(caches.open('puntos-v1').then(function(cache){",
    "    return cache.match(e.request).then(function(cached){",
    "      var fresh=fetch(e.request).then(function(r){cache.put(e.request,r.clone());return r;}).catch(function(){return cached;});",
    "      return cached||fresh;",
    "    });",
    "  }));",
    "});"
  ].join("\n");
  var blob = new Blob([swCode], {type:"application/javascript"});
  var swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(function(){});
}
